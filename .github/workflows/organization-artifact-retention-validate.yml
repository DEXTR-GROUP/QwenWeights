name: Validate Artifact Retention Changes

on:
  pull_request:
    paths:
      - '.github/workflows/organization-artifact-retention.yml'
      - '.github/workflows/organization-artifact-retention-validate.yml'
      - 'ops/github-artifact-retention.sh'
      - 'ops/artifact-retention-schedule.enabled'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate shell syntax
        run: bash -n ops/github-artifact-retention.sh

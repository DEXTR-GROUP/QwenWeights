name: Repository Artifact Retention

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      apply:
        description: "Выполнить разовое удаление (по умолчанию только предварительный просмотр)"
        required: true
        type: boolean
        default: false
      activate_schedule:
        description: "Включить еженедельное удаление после предварительной проверки (этот запуск останется dry-run)"
        required: true
        type: boolean
        default: false
      retention_days:
        description: "Срок хранения в днях"
        required: true
        type: number
        default: 30

permissions:
  contents: write
  actions: write

concurrency:
  group: repository-artifact-retention
  cancel-in-progress: false

jobs:
  retention:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate shell syntax
        run: bash -n ops/github-artifact-retention.sh

      - name: Read scheduled execution gate
        id: schedule_gate
        if: github.event_name == 'schedule'
        run: |
          gate="$(tr -d '\r\n' < ops/artifact-retention-schedule.enabled)"
          if [[ "$gate" == "enabled" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain disabled scheduled execution
        if: github.event_name == 'schedule' && steps.schedule_gate.outputs.enabled != 'true'
        run: echo "Еженедельное удаление отключено. Сначала выполните dry-run, проверьте сводку, затем отдельно включите расписание через workflow_dispatch."

      - name: Validate and execute retention policy
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RETENTION_DAYS: ${{ github.event_name == 'schedule' && 30 || inputs.retention_days }}
          MODE: ${{ github.event_name == 'schedule' && 'apply' || (inputs.activate_schedule && 'dry-run' || (inputs.apply && 'apply' || 'dry-run')) }}
        run: bash ops/github-artifact-retention.sh

      - name: Enable weekly scheduled execution
        if: github.event_name == 'workflow_dispatch' && inputs.activate_schedule
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current_value="$(tr -d '\r\n' < ops/artifact-retention-schedule.enabled)"
          if [[ "$current_value" == "enabled" ]]; then
            echo "Еженедельное удаление уже включено."
            exit 0
          fi
          current_sha="$(gh api "repos/$REPOSITORY/contents/ops/artifact-retention-schedule.enabled?ref=main" --jq .sha)"
          encoded_content="$(printf 'enabled\n' | base64 -w0)"
          gh api --method PUT "repos/$REPOSITORY/contents/ops/artifact-retention-schedule.enabled" \
            -f message="ops: enable weekly artifact retention" \
            -f content="$encoded_content" \
            -f sha="$current_sha" \
            -f branch=main
